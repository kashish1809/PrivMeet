# PrivMeet CI: runs on every push and pull request.
#
# backend  Django system check plus a migration drift check on SQLite, the same
#          database the local dev instructions use, so no service containers.
# frontend production build of the Vite/React app, to prove it still compiles.
#
# pytest joins once T1.6 is merged (WT3.6). Image builds stay out of CI: they
# are large, and W3.2 builds them on version tags.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      # T1.1 is merged, so a model change without its migration now fails CI.
      - run: python manage.py makemigrations --check --dry-run
