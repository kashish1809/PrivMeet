# PrivMeet installers: builds the Tauri 2 desktop app on real Windows and
# Linux runners, and attaches the installers to a GitHub release on a v* tag.
#
# linux    .deb and .AppImage, linked against WebKitGTK 4.1 (4.0 is not
#          enough for Tauri 2, so the apt step installs the -dev package).
#          The system webview means no Chromium is bundled.
#
# There is no JS build step: tauri.conf.json points frontendDist at the
# plain launcher page, so only the Rust crate and @tauri-apps/cli are
# needed. Node exists just to run `npx tauri`.
#
# Run it from the Actions tab, or push a tag such as v0.1.0. Agents never
# push tags; the release steps are in docs/RELEASING.md (W3.5).

name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    name: Linux (deb + AppImage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libdbus-1-dev build-essential file
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
        working-directory: desktop
      - name: Build deb and AppImage
        working-directory: desktop
        run: npx tauri build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: privmeet-linux
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
