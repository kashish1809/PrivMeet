# PrivMeet image release: runs when a version tag such as v0.1.0 is pushed.
#
# One job builds the CPU image twice-tagged as ghcr.io/vinayakkam/privmeet:
# <version> and :latest. Compose pulls it by default, so `docker compose up`
# needs no source checkout and no local build.
#
# A person pushes the tag for a release, never an agent, and the same version
# string goes into desktop/package.json and frontend/package.json (W3.5).
# The GitHub Actions cache is used, one scope per build, so a rebuild after
# a small Dockerfile change does not start from zero.

name: Docker image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

# A release tag should never be cancelled halfway; a newer tag waits.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/vinayakkam/privmeet

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # v0.1.0 -> 0.1.0: the tag name without the "v" is the image version.
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=cpu
          cache-to: type=gha,mode=max,scope=cpu
