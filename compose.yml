# PrivMeet stack: the PrivMeet server (Rust: API, web app and pipeline in one process) and Ollama.
# Only the web port is published, and only on 127.0.0.1: there is no login.
# .env is optional; the settings Compose reads from it are listed in .env.example.
#
# web pulls ghcr.io/kashish1809/privmeet:${PRIVMEET_VERSION:-latest}, because desktop users
# have no source checkout. Set PRIVMEET_VERSION to pin a release; `docker compose build` or
# `up --build` still builds from source.

name: privmeet

services:
  # No published port: only the server talks to it.
  ollama:
    image: ollama/ollama
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama:/root/.ollama
    mem_limit: ${OLLAMA_MEM:-4g}
    restart: unless-stopped

  # One process: meetings are processed one at a time on its pipeline thread, so only one
  # heavy model is in RAM at a time, and freed memory goes back to the system after each.
  web:
    image: ghcr.io/kashish1809/privmeet:${PRIVMEET_VERSION:-latest}
    build: .
    environment:
      OLLAMA_URL: http://ollama:11434
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
      # Empty means "detect the tier from RAM and CUDA".
      TIER: ${TIER:-}
      CPU_THREADS: ${CPU_THREADS:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      NUM_CTX: ${NUM_CTX:-}
      BEAM_SIZE: ${BEAM_SIZE:-}
      DIARIZE: ${DIARIZE:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - data:/data
    depends_on:
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/system/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: ${WEB_MEM:-4g}
    restart: unless-stopped

volumes:
  data:
  ollama:
