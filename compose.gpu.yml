# GPU override for an NVIDIA host. Use it on top of compose.yml:
#
#   docker compose -f compose.yml -f compose.gpu.yml up -d
#
# The desktop app and scripts/privmeet.sh add it on their own when `nvidia-smi` works.
# Needs the NVIDIA driver and the NVIDIA Container Toolkit on the host; the GPU image
# (Dockerfile, GPU=1) has whisper.cpp built with CUDA and the CUDA runtime it needs.
#
# The server (Whisper) and Ollama get the GPU. Without a usable GPU the server reports
# "cpu" and runs whisper.cpp on the CPU (native/server/src/hw.rs).

services:
  web:
    # The GPU image is published as <version>-gpu (docker.yml). `build` lets
    # `docker compose ... up --build` make it from source when no published tag exists.
    image: ghcr.io/kashish1809/privmeet:${PRIVMEET_VERSION:-latest}-gpu
    build:
      context: .
      args:
        GPU: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
