[package]
name = "privmeet-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["fs"] }
uuid = { version = "1.29.3", features = ["v4"] }
