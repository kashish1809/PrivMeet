[package]
name = "privmeet-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "multipart"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sherpa-rs = "0.6.8"
# already built for sherpa-rs (same version); used directly only to set the diarizer's threads
sherpa-rs-sys = { version = "=0.6.8", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "sync", "time", "io-util"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["fs"] }
uuid = { version = "1.29.3", features = ["v4"] }
whisper-rs = "0.16"

[features]
# whisper.cpp with CUDA; without it the server reports and uses the CPU only
cuda = ["whisper-rs/cuda"]
