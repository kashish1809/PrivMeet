<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PrivMeet</title>
    <link rel="stylesheet" href="launcher.css" />
  </head>
  <body>
    <main class="card">
      <header class="brand">
        <span class="logo" aria-hidden="true">P</span>
        <div>
          <h1>PrivMeet</h1>
          <p class="tagline">Self-hosted AI meeting notes</p>
        </div>
      </header>

      <p class="status" id="status" role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <span id="status-text">Checking Docker…</span>
      </p>

      <ol class="steps" id="steps">
        <li data-step="docker">Checking Docker</li>
        <li data-step="start">Starting PrivMeet</li>
        <li data-step="wait">Waiting for the server</li>
      </ol>

      <!-- Shown when a step fails: what went wrong, how to fix it, and a way to try again. -->
      <section class="panel" id="panel" hidden aria-labelledby="panel-title">
        <h2 id="panel-title">What to do</h2>
        <p class="panel-text" id="panel-text"></p>
        <ul class="panel-list" id="panel-list"></ul>
        <button type="button" class="link" id="docs">Open the install guide</button>
      </section>

      <div class="actions">
        <button type="button" class="button" id="retry" hidden>Retry</button>
        <button type="button" class="link" id="toggle-logs" aria-expanded="false" aria-controls="logs">
          Show logs
        </button>
      </div>

      <pre class="logs" id="logs" role="log" aria-live="off" hidden></pre>

      <label class="setting">
        <input type="checkbox" id="keep-running" />
        <span>
          <strong>Keep running in background on quit</strong>
          <span class="setting-hint">Leave the containers up so the app opens instantly next time.</span>
        </span>
      </label>

      <footer class="foot">
        <span id="version">v0.1.0</span>
        <span>Local only · no account · MIT</span>
      </footer>
    </main>
    <script src="launcher.js"></script>
  </body>
</html>
