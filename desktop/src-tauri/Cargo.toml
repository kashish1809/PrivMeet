[package]
name = "privmeet"
version = "0.1.0"
description = "PrivMeet desktop shell"
authors = ["Kashish R Shetty", "K Vinayak Kamath", "HM Karthik"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

# Exposed as a library so the desktop binary stays a three-line wrapper; A2.2
# adds the backend-manager commands there.
[lib]
name = "privmeet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The system webview only (WebView2 / WebKitGTK): no bundled Chromium, no Electron.
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Docker and the localhost status check run as async child processes / sockets.
tauri-plugin-opener = "2"
# A second launch has to raise the window that is already open, not start a second stack.
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["process", "io-util", "net", "sync", "time"] }

# Media capture permissions (A2.4). The webview crates must match the versions
# tauri/wry already pull in, so feature flags unify instead of building twice.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"

# WebView2 is the Windows webview. These are the same versions tauri/wry pin, so
# the COM types are shared instead of duplicated.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
